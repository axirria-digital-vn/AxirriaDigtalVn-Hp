<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{head}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="{{base}}style.css">
</head>
<body>

{{header}}

<main id="top">
  <section class="hero desk">
    <div class="container hero-in">
      <div class="hero-text">
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <a class="btn" href="#contact" data-i18n="hero.cta1"></a>
      </div>
      <div class="sheet stock" role="figure" aria-labelledby="sheetTitle">
        <h2 id="sheetTitle"><span data-i18n="est.title"></span> <small data-i18n="est.team"></small></h2>
        <div class="tbl">
          <table class="est">
            <thead><tr><th scope="col" data-i18n="est.task"></th><th scope="col" data-i18n="est.dev"></th><th scope="col" class="r" data-i18n="est.ai"></th></tr></thead>
            <tbody>
              <!-- bar widths: 10 working days = 100% -->
              <tr><th scope="row" data-i18n="est.r1"></th><td><i class="bar old" style="--w:50%"></i><span class="d" data-i18n="est.d1"></span></td><td class="h">4.0h</td></tr>
              <tr><th scope="row" data-i18n="est.r2"></th><td><i class="bar old" style="--w:40%"></i><span class="d" data-i18n="est.d2"></span></td><td class="h">3.0h</td></tr>
              <tr><th scope="row" data-i18n="est.r3"></th><td><i class="bar old" style="--w:100%"></i><span class="d" data-i18n="est.d3"></span></td><td class="h">5.0h</td></tr>
              <tr><th scope="row" data-i18n="est.r4"></th><td><i class="bar old" style="--w:50%"></i><span class="d" data-i18n="est.d4"></span></td><td class="h" data-i18n="est.par"></td></tr>
            </tbody>
            <tfoot><tr><th scope="row" data-i18n="est.total"></th><td><span class="d" data-i18n="est.d5"></span></td><td class="h">12h</td></tr></tfoot>
          </table>
        </div>
        <p class="stamp" data-i18n="est.demo"></p>
      </div>
    </div>
    <div class="container shelf" id="products">
      {{productCards}}
    </div>
  </section>

  <section id="estimate" class="sec band-ink">
    <div class="container">
      <div class="head split">
        <h2 data-i18n="est.q"></h2>
        <p class="lead" data-i18n="est.a"></p>
      </div>
      <div class="tbl">
        <table class="cmp">
          <thead><tr><th scope="col"></th><th scope="col" data-i18n="cmp.old"></th><th scope="col" data-i18n="cmp.new"></th></tr></thead>
          <tbody data-i18n="cmp.rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="offshore" class="sec tint">
    <div class="container">
      <div class="head split">
        <h2 data-i18n="off.title"></h2>
        <p class="lead" data-i18n="off.lead"></p>
      </div>
      <ol class="pillars">
        <li><h3 data-i18n="off.p1t"></h3><p data-i18n="off.p1d"></p></li>
        <li><h3 data-i18n="off.p2t"></h3><p data-i18n="off.p2d"></p></li>
        <li><h3 data-i18n="off.p3t"></h3><p data-i18n="off.p3d"></p></li>
        <li><h3 data-i18n="off.p4t"></h3><p data-i18n="off.p4d"></p></li>
      </ol>
      <div class="day" role="figure" aria-labelledby="dayTitle">
        <p id="dayTitle" class="day-t" data-i18n="day.title"></p>
        <div class="lane"><span data-i18n="day.dev"></span><div class="track"><i class="dev" style="--x:37.5%;--w:37.5%"></i></div></div>
        <div class="lane"><span data-i18n="day.ai"></span><div class="track"><i class="loop" style="--x:0%;--w:100%"></i></div></div>
        <div class="axis" aria-hidden="true"><span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
        <p class="day-n" data-i18n="day.note"></p>
      </div>
    </div>
  </section>

  <section id="services" class="sec">
    <div class="container">
      <div class="head split">
        <h2 data-i18n="svc.title"></h2>
        <p class="lead" data-i18n="svc.lead"></p>
      </div>
      <div class="svc">
        <article><h3 data-i18n="svc1.t"></h3><p data-i18n="svc1.d"></p><ul data-i18n="svc1.l"></ul></article>
        <article><h3 data-i18n="svc2.t"></h3><p data-i18n="svc2.d"></p><ul data-i18n="svc2.l"></ul></article>
        <article><h3 data-i18n="svc3.t"></h3><p data-i18n="svc3.d"></p><ul data-i18n="svc3.l"></ul></article>
      </div>
    </div>
  </section>

  <section id="pricing" class="sec tint">
    <div class="container start">
      <div class="head split">
        <h2 data-i18n="start.q"></h2>
        <p class="lead" data-i18n="plan.title"></p>
      </div>
      <ol class="steps">
        <li><h3 data-i18n="step1.t"></h3><p data-i18n="step1.d"></p></li>
        <li><h3 data-i18n="step2.t"></h3><p data-i18n="step2.d"></p></li>
        <li><h3 data-i18n="step3.t"></h3><p data-i18n="step3.d"></p></li>
        <li><h3 data-i18n="step4.t"></h3><p data-i18n="step4.d"></p></li>
      </ol>
      <div class="plan">
        <div>
          <p class="plan-price" data-i18n="plan.price"></p>
          <p class="plan-note" data-i18n="plan.note"></p>
        </div>
        <div class="plan-act">
          <a class="btn" href="#contact" data-i18n="plan.cta"></a>
          <p class="plan-mail"><a href="mailto:{{cfg.email}}">{{cfg.email}}</a></p>
        </div>
      </div>
    </div>
  </section>

  <section id="cases" class="sec">
    <div class="container">
      <div class="head split">
        <h2 data-i18n="cs.title"></h2>
        <p class="lead" data-i18n="cs.lead"></p>
      </div>
      <div class="cases">
        <article class="case" data-i18n="cs.1"></article>
        <article class="case" data-i18n="cs.2"></article>
      </div>
      <div class="partner">
        <div>
          <h3 data-i18n="pt.title"></h3>
          <blockquote data-i18n="pt.quote"></blockquote>
          <p data-i18n="pt.lead"></p>
          <p class="pt-link"><a class="textlink" href="https://www.axirria.co.jp/" target="_blank" rel="noopener" data-i18n="pt.link"></a></p>
        </div>
        <dl>
          <dt data-i18n="pt1.t"></dt><dd data-i18n="pt1.d"></dd>
          <dt data-i18n="pt2.t"></dt><dd data-i18n="pt2.d"></dd>
          <dt data-i18n="pt3.t"></dt><dd data-i18n="pt3.d"></dd>
        </dl>
      </div>
    </div>
  </section>

  <section id="faq" class="sec tint">
    <div class="container faq">
      <div class="head split">
        <h2 data-i18n="faq.title"></h2>
      </div>
      <div class="faq-list" data-i18n="faq.items"></div>
    </div>
  </section>

  <section id="company" class="sec">
    <div class="container">
      <div class="head split">
        <h2 data-i18n="co.q"></h2>
      </div>
      <div class="about">
        <div class="co">
          <h3 data-i18n="co.title"></h3>
          <dl class="info" data-i18n="co.info"></dl>
        </div>
        <div id="news" class="co">
          <h3 data-i18n="nw.title"></h3>
          <ul class="news" data-i18n="nw.items"></ul>
        </div>
      </div>
    </div>
  </section>

  <section id="contact" class="sec tint">
    <div class="container contact">
      <div class="head split">
        <h2 data-i18n="ct.title"></h2>
        <div class="contact-side">
          <p class="lead" data-i18n="ct.lead"></p>
          <div class="ways">
            <a href="mailto:{{cfg.email}}"><small data-i18n="ct.mail"></small><strong>{{cfg.email}}</strong></a>
          </div>
        </div>
      </div>
      <form id="contactForm" action="{{cfg.formEndpoint}}" method="POST">
        <div class="row2">
          <label><span data-i18n="f.name"></span><input name="name" required autocomplete="name"></label>
          <label><span data-i18n="f.company"></span><input name="company" autocomplete="organization"></label>
        </div>
        <label><span data-i18n="f.email"></span><input type="email" name="email" required autocomplete="email"></label>
        <label><span data-i18n="f.topic"></span><select name="topic" data-i18n="f.topics"></select></label>
        <label><span data-i18n="f.msg"></span><textarea name="message" rows="5" required></textarea></label>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="ts">
        {{turnstile}}
        <label class="consent"><input type="checkbox" name="privacy_consent" value="yes" required><span data-i18n="f.consent"></span></label>
        <button class="btn" type="submit" data-i18n="f.send"></button>
        <p id="formMsg" role="status"></p>
      </form>
    </div>
  </section>
</main>

{{footer}}

<script src="{{base}}i18n.js"></script>
<script src="{{base}}main.js"></script>
</body>
</html>
